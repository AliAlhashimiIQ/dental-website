<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="55%" stop-color="#112239" />
      <stop offset="100%" stop-color="#17304E" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tabA1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tabA2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="tabB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="65%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="metalStem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Architectural Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#ambientGlow)" />

  <!-- Subtle Optical Calibration Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="120" x2="720" y2="120" />
    <line x1="80" y1="240" x2="720" y2="240" />
    <line x1="80" y1="360" x2="720" y2="360" />
    <line x1="80" y1="480" x2="720" y2="480" />
    <line x1="200" y1="80" x2="200" y2="520" />
    <line x1="400" y1="80" x2="400" y2="520" />
    <line x1="600" y1="80" x2="600" y2="520" />
  </g>

  <!-- Concentric Optical Arcs -->
  <circle cx="400" cy="460" r="280" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="400" cy="460" r="360" stroke="#F8FAFC" stroke-opacity="0.08" stroke-width="1" />

  <!-- Porcelain Shade Tabs Fan -->
  <!-- Tab 1 (Leftmost) -->
  <g transform="translate(215, 250) rotate(-18)" filter="url(#softShadow)">
    <rect x="-8" y="95" width="16" height="110" rx="3" fill="url(#metalStem)" />
    <path d="M-36 0 C-36 -38, 36 -38, 36 0 L28 92 C28 104, -28 104, -28 92 Z" fill="url(#tabA2)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M-24 -6 C-12 -24, 12 -24, 24 -6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <text x="0" y="135" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2M1</text>
  </g>

  <!-- Tab 2 -->
  <g transform="translate(305, 215) rotate(-9)" filter="url(#softShadow)">
    <rect x="-8" y="95" width="16" height="120" rx="3" fill="url(#metalStem)" />
    <path d="M-38 0 C-38 -40, 38 -40, 38 0 L30 94 C30 106, -30 106, -30 94 Z" fill="url(#tabA1)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M-25 -8 C-12 -26, 12 -26, 25 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <text x="0" y="138" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1M2</text>
  </g>

  <!-- Tab 3 (Center Focal Ceramic Specimen) -->
  <g transform="translate(400, 195)" filter="url(#softShadow)">
    <rect x="-9" y="102" width="18" height="135" rx="3" fill="url(#metalStem)" />
    <path d="M-42 0 C-42 -44, 42 -44, 42 0 L33 100 C33 114, -33 114, -33 100 Z" fill="url(#tabB1)" stroke="#38BDF8" stroke-width="2" />
    <path d="M-28 -10 C-14 -30, 14 -30, 28 -10" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <ellipse cx="0" cy="36" rx="22" ry="38" fill="#FFFFFF" fill-opacity="0.45" />
    <text x="0" y="145" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1M1</text>
  </g>

  <!-- Tab 4 -->
  <g transform="translate(495, 215) rotate(9)" filter="url(#softShadow)">
    <rect x="-8" y="95" width="16" height="120" rx="3" fill="url(#metalStem)" />
    <path d="M-38 0 C-38 -40, 38 -40, 38 0 L30 94 C30 106, -30 106, -30 94 Z" fill="url(#tabA1)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M-25 -8 C-12 -26, 12 -26, 25 -8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <text x="0" y="138" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">0M3</text>
  </g>

  <!-- Tab 5 (Rightmost) -->
  <g transform="translate(585, 250) rotate(18)" filter="url(#softShadow)">
    <rect x="-8" y="95" width="16" height="110" rx="3" fill="url(#metalStem)" />
    <path d="M-36 0 C-36 -38, 36 -38, 36 0 L28 92 C28 104, -28 104, -28 92 Z" fill="url(#tabA1)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M-24 -6 C-12 -24, 12 -24, 24 -6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <text x="0" y="135" fill="#0F172A" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">0M2</text>
  </g>

  <!-- Anodized Holder Bar -->
  <rect x="170" y="435" width="460" height="44" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" filter="url(#softShadow)" />
  <line x1="200" y1="457" x2="600" y2="457" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="400" cy="457" r="5" fill="#38BDF8" />

  <!-- Editorial Technical Annotation -->
  <text x="690" y="95" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="end">FIG. 01 — CERAMIC SHADE CALIBRATION</text>
  <text x="690" y="535" fill="#CBD5E1" font-family="sans-serif" font-size="14" text-anchor="end">مقياس تدرجات المينا والسيراميك الطبيعي · دراسة ضوئية</text>
</svg>
